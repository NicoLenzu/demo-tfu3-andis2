# API GATEWAY / BALANCEADOR DE CARGA
# 
# Cumple dos roles arquitectonicos:
#  1) INTERFAZ UNICA: los clientes (curl/Postman) solo conocen http://localhost:8080.
#     Los componentes internos no se exponen al exterior, superficie de ataque
#     minima y libertad para reubicar/reescalar servicios sin romper clientes.
#  2) ESCALABILIDAD HORIZONTAL: cuando corremos `docker compose up --scale queue=3`,
#     el DNS interno de Docker (127.0.0.11) devuelve 3 direcciones IP para el
#     nombre "queue". nginx las recorre en round-robin.
#  3) PATRON 2 - RATE LIMITING: corta rafagas abusivas por IP (respuesta al
#     feedback de DoS). Limita la tasa de requests y las conexiones simultaneas,
#     y devuelve un 429 JSON uniforme en vez de la pagina de error de nginx.
#
# si escribieramos `proxy_pass http://queue:3000;` nginx
# resolveria el DNS UNA sola vez al arrancar y nunca veria las replicas nuevas.
# Al usar una VARIABLE ($upstream) nginx re-resuelve el DNS en cada request,
# con lo cual detecta replicas agregadas o quitadas en caliente.
#
# ---------------------------------------------------------------------------
# VALORES CONFIGURABLES (documentados; nginx no admite variables en directivas,
# por eso se editan aca):
#   RATE_API    = 20r/s   (trafico general de /api/)
#   RATE_LOGIN  =  5r/s   (endpoint de login, mas sensible a fuerza bruta)
#   BURST_API   = 40      (rafaga tolerada en /api/)
#   BURST_LOGIN =  5      (rafaga tolerada en login)
#   MAX_CONN    = 30      (conexiones simultaneas por IP)
# ---------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    # Resolver = DNS embebido de Docker. valid=1s revisa cambios cada segundo.
    resolver 127.0.0.11 valid=1s ipv6=off;

    log_format principal '$remote_addr "$request" $status '
                         'upstream=$upstream_addr tiempo=$request_time';
    access_log /dev/stdout principal;

    # Timeouts cortos: si un componente se cuelga, fallamos rapido en vez de
    # acumular conexiones (evita el efecto domino / cascada de fallos).
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    # -----------------------------------------------------------------------
    # PATRON 2 - RATE LIMITING (nginx, en el borde)
    # Limitamos por IP de origen. El login tiene su propia zona, mas estricta,
    # porque es el endpoint que un atacante usa para fuerza bruta.
    # -----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    server {
        listen 80;

        # headers estandar hacia los componentes internos
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Authorization     $http_authorization;

        # Exponemos al cliente que replica atendio (evidencia del balanceo).
        add_header X-Gateway "nginx" always;

        # Cuerpo JSON uniforme para los rechazos por limite.
        error_page 429 = @limitado;

        location = / {
            default_type application/json;
            return 200 '{"ok":true,"servicio":"clinicare-gateway","health":"/healthz","login":"POST /api/auth/login"}';
        }

        # /healthz queda EXCLUIDO de los limites: lo usan el monitoreo y Docker.
        location = /healthz {
            default_type application/json;
            return 200 '{"ok":true,"componente":"gateway"}';
        }

        # Login: zona propia, mas estricta.
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $upstream_auth http://auth:3000;
            proxy_pass $upstream_auth$request_uri;
        }

        # ENDPOINTS DE DEMOSTRACION: excluidos del rate limiting por IP.
        # Los scripts 3 y 9 disparan 200 requests a -P 20 contra estos endpoints
        # para medir la cola y el cache. Si los limitaramos, la medicion seria de
        # nginx (429) y no del patron. No son rutas de negocio criticas.
        location = /api/queue/farmacia/resumen {
            set $upstream_que http://queue:3000;
            proxy_pass $upstream_que$request_uri;
        }

        location = /api/scheduling/slots {
            set $upstream_sch http://scheduling:3000;
            proxy_pass $upstream_sch$request_uri;
        }

        location /api/auth/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 30;
            set $upstream_auth http://auth:3000;
            proxy_pass $upstream_auth$request_uri;
        }

        location /api/scheduling/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 30;
            set $upstream_sch http://scheduling:3000;
            proxy_pass $upstream_sch$request_uri;
        }

        location /api/records/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 30;
            set $upstream_rec http://records:3000;
            proxy_pass $upstream_rec$request_uri;
        }

        location /api/pharmacy/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 30;
            set $upstream_pha http://pharmacy:3000;
            proxy_pass $upstream_pha$request_uri;
        }

        # Este es el que escalamos en la demo: el nombre "queue" puede resolver
        # a 1, 3 o N contenedores y nginx reparte el trafico entre todos.
        location /api/queue/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 30;
            set $upstream_que http://queue:3000;
            proxy_pass $upstream_que$request_uri;
        }

        location /api/notifications/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 30;
            set $upstream_not http://notifications:3000;
            proxy_pass $upstream_not$request_uri;
        }

        location @limitado {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"Demasiadas solicitudes","patron":"rate-limiting"}';
        }
    }
}
