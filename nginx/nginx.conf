# API GATEWAY / BALANCEADOR DE CARGA / BORDE DE SEGURIDAD
#
# Cumple varios roles arquitectonicos:
#  1) INTERFAZ UNICA: los clientes (curl/Postman) solo conocen http://localhost:8080
#     (y https://localhost:8443). Los componentes internos no se exponen.
#  2) ESCALABILIDAD HORIZONTAL: con `--scale queue=3`, el DNS interno de Docker
#     (127.0.0.11) devuelve N direcciones y se reparten las requests.
#  3) PATRON 2 - RATE LIMITING: corta rafagas abusivas (respuesta al feedback de DoS).
#  4) PATRON 5 - GATEKEEPER: nginx ya NO habla con los servicios de negocio;
#     manda TODO /api/ al gatekeeper, que centraliza el control de acceso.
#  5) PATRON 6 - GATEWAY OFFLOADING: TLS, cabeceras de seguridad, compresion y
#     limite de tamano se resuelven en el borde. Adentro se habla HTTP plano.
#
# ---------------------------------------------------------------------------
# VALORES CONFIGURABLES (documentados; nginx no admite variables en directivas,
# por eso se editan aca y en docker-compose.yml):
#   RATE_API    = 20r/s   (trafico general de /api/)
#   RATE_LOGIN  =  5r/s   (endpoint de login, mas sensible a fuerza bruta)
#   BURST_API   = 40      (rafaga tolerada en /api/)
#   BURST_LOGIN =  5      (rafaga tolerada en login)
#   MAX_CONN    = 30      (conexiones simultaneas por IP)
#   MAX_BODY    = 200k    (tamano maximo de cuerpo en el borde)
# ---------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    # Resolver = DNS embebido de Docker. valid=1s revisa cambios cada segundo.
    resolver 127.0.0.11 valid=1s ipv6=off;

    log_format principal '$remote_addr "$request" $status '
                         'upstream=$upstream_addr tiempo=$request_time';
    access_log /dev/stdout principal;

    # Timeouts cortos: si un componente se cuelga, fallamos rapido en vez de
    # acumular conexiones (evita el efecto domino / cascada de fallos).
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    # -----------------------------------------------------------------------
    # PATRON 2 - RATE LIMITING (nginx, en el borde)
    # Limitamos por IP de origen. El login tiene su propia zona, mas estricta,
    # porque es el endpoint que un atacante usa para fuerza bruta.
    # -----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # -----------------------------------------------------------------------
    # PATRON 6 - GATEWAY OFFLOADING (borde)
    # TLS, cabeceras de seguridad, compresion y limite de cuerpo viven aca.
    # Los servicios internos hablan HTTP plano: NO cargan con TLS ni con gzip.
    # -----------------------------------------------------------------------
    server_tokens off;                 # no revelamos la version de nginx
    client_max_body_size 200k;         # cortamos cuerpos enormes en el borde
    gzip on;
    gzip_types application/json;
    gzip_proxied any;                  # imprescindible: comprimir respuestas proxeadas
    gzip_min_length 20;

    # Correlation-id: si el cliente no manda uno, lo generamos con $request_id.
    # Asi TODA request que entra al sistema es trazable de punta a punta.
    map $http_x_correlation_id $cid_final {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # -----------------------------------------------------------------------
    # SERVIDOR HTTP (puerto 80 -> publicado como 8080)  COMPATIBILIDAD
    # Se mantiene sin redirigir para que los scripts 0-6 sigan funcionando.
    # -----------------------------------------------------------------------
    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Correlation-Id  $cid_final;

        add_header X-Gateway "nginx" always;
        add_header X-Request-Id $request_id always;

        # Cuerpo JSON uniforme para los rechazos por limite.
        error_page 429 = @limitado;

        location = / {
            default_type application/json;
            return 200 '{"ok":true,"servicio":"clinicare-gateway","health":"/healthz","login":"POST /api/auth/login"}';
        }

        # /healthz queda EXCLUIDO de los limites: lo usan el monitoreo y Docker.
        location = /healthz {
            default_type application/json;
            return 200 '{"ok":true,"componente":"gateway"}';
        }

        # Login: zona propia, mas estricta. Se proxea al gatekeeper.
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $upstream_gk http://gatekeeper:3000;
            proxy_pass $upstream_gk$request_uri;
        }

        # ENDPOINTS DE DEMOSTRACION: excluidos del rate limiting por IP.
        # Los scripts 3 (QBLL) y 9 (cache) disparan 200 requests a -P 20 contra
        # estos endpoints para medir latencia y aciertos. Si los limitaramos, la
        # medicion seria de nginx (429) y no del patron. Excluirlos NO debilita el
        # sistema: siguen detras del gatekeeper y no son rutas de negocio criticas.
        location = /api/queue/farmacia/resumen {
            set $upstream_gk http://gatekeeper:3000;
            proxy_pass $upstream_gk$request_uri;
        }

        location = /api/scheduling/slots {
            set $upstream_gk http://gatekeeper:3000;
            proxy_pass $upstream_gk$request_uri;
        }

        # Resto de la API: limite general + tope de conexiones por IP.
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 30;
            set $upstream_gk http://gatekeeper:3000;
            proxy_pass $upstream_gk$request_uri;
        }

        location @limitado {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"Demasiadas solicitudes","patron":"rate-limiting"}';
        }
    }

    # -----------------------------------------------------------------------
    # SERVIDOR HTTPS (puerto 443 -> publicado como 8443)  PATRON 6
    # Misma logica de ruteo que el 80, mas las cabeceras de seguridad y TLS.
    # El certificado es autofirmado y lo genera scripts/gen-certs.sh.
    # -----------------------------------------------------------------------
    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Cabeceras de seguridad (offloading en el borde). "always" = tambien
        # en respuestas de error. Ojo: si una location define add_header, deja
        # de heredar estas; por eso las locations de abajo NO agregan headers.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Gateway "nginx" always;
        add_header X-Request-Id $request_id always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Correlation-Id  $cid_final;

        error_page 429 = @limitado;

        location = / {
            default_type application/json;
            return 200 '{"ok":true,"servicio":"clinicare-gateway","tls":true,"health":"/healthz"}';
        }

        location = /healthz {
            default_type application/json;
            return 200 '{"ok":true,"componente":"gateway","tls":true}';
        }

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            set $upstream_gk http://gatekeeper:3000;
            proxy_pass $upstream_gk$request_uri;
        }

        # Mismos endpoints de demostracion exentos que en el puerto 80.
        location = /api/queue/farmacia/resumen {
            set $upstream_gk http://gatekeeper:3000;
            proxy_pass $upstream_gk$request_uri;
        }

        location = /api/scheduling/slots {
            set $upstream_gk http://gatekeeper:3000;
            proxy_pass $upstream_gk$request_uri;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            limit_conn conn 30;
            set $upstream_gk http://gatekeeper:3000;
            proxy_pass $upstream_gk$request_uri;
        }

        location @limitado {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"Demasiadas solicitudes","patron":"rate-limiting"}';
        }
    }
}
